<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>%GAME_NAME%</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070a10; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
      font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; color: #eef2f7; letter-spacing: .1em; text-transform: uppercase; }
    canvas { display: block; width: 100%; height: 100%; }
    .fx { position: fixed; inset: 0; pointer-events: none; } .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #vig { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(2,4,8,.8) 100%); }
    #hurt { background: radial-gradient(ellipse at center, rgba(255,30,20,0) 40%, rgba(255,30,20,.6) 100%); opacity: 0; }
    #cross { left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
    #cross i { position: absolute; background: #fff; box-shadow: 0 0 3px #000; } #cross.on i { background: #ff3b30; }
    #cross i:nth-child(1) { left: 10px; top: 0; width: 2px; height: 7px; } #cross i:nth-child(2) { left: 10px; bottom: 0; width: 2px; height: 7px; }
    #cross i:nth-child(3) { top: 10px; left: 0; height: 2px; width: 7px; } #cross i:nth-child(4) { top: 10px; right: 0; height: 2px; width: 7px; }
    #top { top: 12px; left: 150px; right: 150px; text-align: center; font-size: 12px; } #top b { display: block; font-size: 19px; color: #ffb347; }
    #bar2 { width: min(360px, 60%); height: 6px; margin: 6px auto 2px; background: rgba(255,255,255,.18); display: none; } #bar2 i { display: block; height: 100%; background: #ff3b30; }
    #vit { left: 22px; bottom: 18px; font-size: 11px; } #vit b { font-size: 40px; font-weight: 700; letter-spacing: .02em; display: block; line-height: 1; }
    #bar { width: 180px; height: 5px; background: rgba(255,255,255,.2); margin-top: 6px; } #hp { height: 100%; background: #ffb347; width: 100%; }
    #ammo { right: 24px; bottom: 18px; text-align: right; font-size: 11px; } #ammo b { font-size: 44px; font-weight: 700; letter-spacing: .02em; line-height: 1; display: block; }
    #coins { right: 24px; top: 14px; font-size: 16px; color: #ffb347; }
    #note { left: 0; right: 0; top: 62%; text-align: center; font-size: 15px; color: #ffb347; }
    #radar { left: 16px; top: 14px; width: 120px; height: 120px; }
    #arrow { left: 50%; top: 50%; width: 0; height: 0; margin: -11px 0 0 -13px; border-left: 13px solid transparent; border-right: 13px solid transparent; border-bottom: 22px solid #ff3b30; filter: drop-shadow(0 0 6px #ff3b30); display: none; }
    #wp { left: 0; top: 0; display: none; text-align: center; font-size: 12px; color: #35e0ff; width: 80px; margin: -14px 0 0 -40px; }
    #wp i { display: block; width: 14px; height: 14px; margin: 0 auto 4px; border: 2px solid #35e0ff; transform: rotate(45deg); box-shadow: 0 0 8px #35e0ff; }
    #pauseBtn { position: fixed; right: 16px; top: 44px; width: 44px; height: 40px; background: rgba(10,14,22,.6); border: 1px solid rgba(255,255,255,.4); color: #fff; font: inherit; font-size: 16px; display: none; }
    #crouchBtn { position: fixed; right: 20px; bottom: 96px; width: 58px; height: 58px; border-radius: 50%; background: rgba(10,14,22,.55); border: 2px solid rgba(255,255,255,.4); color: #fff; font-size: 22px; display: none; }
    #crouchBtn.on { background: #ffb347; color: #14100a; border-color: #ffb347; }
    .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); pointer-events: none; display: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.5); }
    #screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 20px 7vw; overflow-y: auto; touch-action: pan-y;
      background: linear-gradient(90deg, rgba(4,6,10,.94) 0%, rgba(4,6,10,.72) 60%, rgba(4,6,10,.35) 100%); }
    #screen h1 { margin: 0; font-size: clamp(38px, 8vw, 88px); letter-spacing: .06em; line-height: .95; } #screen h1 span, #screen h2 span { color: #ffb347; }
    #screen h2 { margin: 0 0 14px; font-size: clamp(24px, 4vw, 40px); letter-spacing: .08em; }
    #screen p { margin: 10px 0 18px; font-size: 14px; opacity: .85; max-width: 560px; text-transform: none; letter-spacing: .03em; }
    button.b { font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; padding: 12px 22px; margin: 4px 8px 4px 0; background: rgba(20,26,38,.85); color: #eef2f7; border: 1px solid rgba(255,255,255,.35); cursor: pointer; min-width: 220px; text-align: left; }
    button.b.p { background: #ffb347; color: #14100a; border-color: #ffb347; } button.b.s { min-width: 0; font-size: 12px; padding: 9px 14px; } button.b:disabled { opacity: .4; cursor: default; }
    .col { display: flex; flex-direction: column; align-items: flex-start; } .row { display: flex; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; max-width: 900px; width: 100%; }
    .card { background: rgba(16,20,30,.88); border: 1px solid rgba(255,255,255,.22); padding: 12px 14px; text-align: left; font: inherit; color: inherit; text-transform: uppercase; letter-spacing: .08em; }
    button.card { cursor: pointer; } button.card:hover { border-color: #ffb347; } .card.done { border-color: #7ee081; } .card.lock { opacity: .45; }
    .card b { display: block; color: #ffb347; font-size: 16px; margin-bottom: 6px; } .card small { display: block; text-transform: none; letter-spacing: .02em; font-size: 12px; opacity: .85; min-height: 44px; }
    .card em { font-style: normal; font-size: 12px; color: #ffb347; } .tag { color: #ffb347; font-size: 18px; margin-left: 16px; } .dim { opacity: .6; font-size: 11px; margin-top: 14px; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(16,20,30,.88); border: 1px solid rgba(255,255,255,.2); padding: 8px 12px; margin-bottom: 6px; max-width: 620px; width: 100%; box-sizing: border-box; }
    .line small { display: block; text-transform: none; letter-spacing: .02em; opacity: .75; font-size: 11px; } .big { font-size: 26px; color: #ffb347; margin: 6px 0 14px; }
  </style>
</head>
<body>
  <div class="fx" id="vig"></div><div class="fx" id="hurt"></div>
  <div id="hudAll" style="display:none">
    <div class="hud" id="cross"><i></i><i></i><i></i><i></i></div>
    <div class="hud" id="top"><b id="obj"></b><div id="bar2"><i></i></div><span id="sub2"></span></div>
    <div class="hud" id="vit"><b id="hpn">100</b><div id="bar"><div id="hp"></div></div><div id="buffs" style="margin-top:6px;color:#35e0ff"></div></div>
    <div class="hud" id="ammo"><b id="mag">30</b><span id="wname"></span></div>
    <div class="hud" id="coins"></div><div class="hud" id="note"></div>
    <canvas class="hud" id="radar" width="120" height="120"></canvas><div class="hud" id="arrow"></div><div class="hud" id="wp"><i></i><span></span></div>
    <button id="pauseBtn">II</button><button id="crouchBtn">▼</button>
  </div>
  <div class="stick" id="sl"><i></i></div>
  <div id="screen"></div>
  <script type="module" src="/src/fps/main.ts"></script>
</body>
</html>
