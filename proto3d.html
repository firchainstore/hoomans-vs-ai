<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>%GAME_NAME% — prototipo 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1018; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, sans-serif; color: #f2ecff; }
    canvas { display: block; width: 100%; height: 100%; }
    #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(3,5,10,0.78) 100%); }
    #hud { position: fixed; top: 12px; left: 14px; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #bar { width: 200px; height: 14px; border: 2px solid rgba(255,255,255,.5); background: rgba(0,0,0,.5); }
    #hp { height: 100%; width: 100%; background: #ffb347; }
    #info { margin-top: 6px; font-weight: 600; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; text-align: center; text-shadow: 0 2px 10px #000; transition: opacity .6s; }
    #msg h1 { margin: 0; font-size: 44px; letter-spacing: 2px; color: #ffb347; } #msg p { font-size: 17px; opacity: .9; }
    .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.07); pointer-events: none; display: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.55); }
  </style>
</head>
<body>
  <div id="vig"></div>
  <div id="hud"><div id="bar"><div id="hp"></div></div><div id="info"></div></div>
  <div id="msg"><h1 id="title"></h1><p id="sub"></p></div>
  <div class="stick" id="sl"><i></i></div><div class="stick" id="sr"><i></i></div>
  <script type="module" src="/src/proto3d/main.ts"></script>
</body>
</html>
